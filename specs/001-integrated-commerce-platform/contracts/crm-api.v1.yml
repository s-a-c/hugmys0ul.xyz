openapi: 3.0.0
info:
  title: CRM Service API
  version: v1
  description: API for managing orders in the CRM service.
security:
  - bearerAuth: []
paths:
  /api/v1/orders:
    post:
      summary: Log Sales Order
      description: Receives a new sales order from the E-commerce service to log against the customer's history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: Order logged successfully.
        '422':
          description: Unprocessable Entity (Validation Error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
          format: ulid
        customer_id:
          type: string
          format: ulid
        order_date:
          type: string
          format: date-time
        total_price:
          type: number
          format: float
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
                example: "422"
              title:
                type: string
                example: "Unprocessable Entity"
              detail:
                type: string
                example: "The 'customer_id' field is required."
